{% extends 'base.html' %}

{% block head %}
<title>Search Page</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% endblock %}

{% block body %}
<div class="content">
    <h1 style="text-align: center">Search</h1>
    {% if error %}<p style="color: #b00020; text-align: center">{{ error }}</p>{% endif %}

    <div class="form">
        <form action="/" method="POST">
            <input type="text" name="content" id="content" placeholder="e.g. iphone 15" required>
            <input type="submit" value="Search">
        </form>
    </div>
</div>
{% endblock %}
